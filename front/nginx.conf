worker_processes auto;
events { worker_connections 1024; }

http {
  # ★ MIME 매핑 추가 (js/css/svg 등 올바른 Content-Type 제공)
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # WebSocket/SSE용 헤더 매핑
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream backend {
    # least_conn;  # 필요 시
    server backend-blue:8080  max_fails=3 fail_timeout=10s;
    # server backend-green:8080 max_fails=3 fail_timeout=10s backup;
    keepalive 32;
  }

  log_format timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time urt=$upstream_response_time uaddr=$upstream_addr';
  access_log /dev/stdout timed;
  error_log  /dev/stderr warn;

  add_header X-Upstream-Addr $upstream_addr always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
      text/plain text/css text/xml text/javascript
      application/javascript application/json application/xml
      application/xml+rss application/font-woff application/font-woff2
      image/svg+xml;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

  server {
    listen 80;
    server_name localhost;
    client_max_body_size 20m;

    # Prometheus nginx-exporter용 상태
    location /stub_status {
      stub_status on; access_log off;
      allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
    }

    # 정적 파일 (Vite/SPA)
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA 라우팅
    location / {
      try_files $uri $uri/ /index.html;
    }

    # API 프록시
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket/SSE
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;

      proxy_no_cache 1;
      proxy_cache_bypass 1;
      
      add_header X-Upstream-Addr $upstream_addr always;

    }

    # (선택) 레거시 컨텍스트 경로
    location /ozea/ {
      proxy_pass http://backend/ozea/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: http: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: http:;" always;
  }
}