name: auto-merge-deps
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && contains(join(fromJson(toJson(github.event.pull_request.labels)).*.name, ','), 'dependencies')
    runs-on: ubuntu-latest
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          target: minor
