name: back-ci
on:
  pull_request:
    paths: ['back/**', '.github/workflows/back-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: back } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - run: ./gradlew -q test
